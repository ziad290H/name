version: '3.8'

services:
  alert-ingestion:
    build: ./alert-ingestion
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-ui:
    build: ./web-ui
    ports:
      - "8080:80"
    depends_on:
      - alert-ingestion
