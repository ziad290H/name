<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Monitoring Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* CSS Variables */
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --bg-sidebar: #1e293b;
      --bg-accent: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      --radius: 12px;
      --transition: all 0.2s ease;
      --open: #ef4444;
      --acknowledged: #f59e0b;
      --resolved: #10b981;
      --low: #3b82f6;
      --medium: #f59e0b;
      --high: #ef4444;
      --critical: #7c3aed;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    /* Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.25rem;
      background: linear-gradient(90deg, #60a5fa, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
      margin: 2px 8px;
      border-radius: 8px;
    }

    .nav-item:hover {
      background-color: var(--bg-accent);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.1));
      border-left: 3px solid var(--primary);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-icon {
      width: 20px;
      text-align: center;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 24px;
      border-top: 1px solid var(--border-color);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .user-info h4 {
      font-size: 0.875rem;
      font-weight: 600;
    }

    .user-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Main Content */
    .main {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: #2563eb;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--bg-accent);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background-color: #475569;
      transform: translateY(-1px);
    }

    /* Summary Stats */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
    }

    .stat-card.total::before {
      background: linear-gradient(to bottom, #60a5fa, #3b82f6);
    }

    .stat-card.open::before {
      background-color: var(--open);
    }

    .stat-card.acknowledged::before {
      background-color: var(--acknowledged);
    }

    .stat-card.resolved::before {
      background-color: var(--resolved);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .stat-title {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .stat-card.total .stat-icon {
      background-color: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .stat-card.open .stat-icon {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--open);
    }

    .stat-card.acknowledged .stat-icon {
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--acknowledged);
    }

    .stat-card.resolved .stat-icon {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--resolved);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-change {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-change.positive {
      color: var(--success);
    }

    .stat-change.negative {
      color: var(--danger);
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    /* Incident Cards */
    .incident-card {
      background-color: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .incident-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      border-color: #475569;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .service-name {
      font-weight: 600;
      font-size: 1.125rem;
    }

    .incident-id {
      font-size: 0.75rem;
      color: var(--text-muted);
      background-color: var(--bg-accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-family: monospace;
    }

    .incident-details {
      margin: 20px 0;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .detail-value {
      font-weight: 500;
      font-size: 0.875rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .time-display {
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: var(--bg-accent);
      color: var(--text-primary);
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .action-btn:hover {
      background-color: #475569;
    }

    .dashboard-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 32px 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 20px;
      color: white;
    }

    .severity-badge {
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .severity-low { background-color: var(--low); }
    .severity-medium { background-color: var(--medium); }
    .severity-high { background-color: var(--high); }
    .severity-critical { background-color: var(--critical); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-open { background-color: var(--open); }
    .status-acknowledged { background-color: var(--acknowledged); }
    .status-resolved { background-color: var(--resolved); }

    /* Loading State */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 1100px) {
      .sidebar {
        width: 80px;
        padding: 20px 0;
      }
      
      .logo-text, .nav-text, .user-info {
        display: none;
      }
      
      .logo {
        justify-content: center;
        padding: 0 0 24px;
      }
      
      .nav-item {
        justify-content: center;
        padding: 16px 0;
        margin: 2px 12px;
      }
      
      .sidebar-footer {
        padding: 16px;
        display: flex;
        justify-content: center;
      }
      
      .user-profile {
        justify-content: center;
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        height: auto;
        flex-direction: row;
        padding: 12px;
        position: relative;
      }
      
      .logo {
        border-bottom: none;
        border-right: 1px solid var(--border-color);
        padding-right: 16px;
        margin-right: 16px;
        margin-bottom: 0;
      }
      
      .nav {
        display: flex;
        flex: 1;
      }
      
      .nav-item {
        flex-direction: column;
        padding: 8px 12px;
        font-size: 0.75rem;
      }
      
      .sidebar-footer {
        display: none;
      }
      
      .main {
        padding: 20px;
      }
      
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .summary {
        grid-template-columns: 1fr;
      }
      
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      
      .btn {
        padding: 10px 14px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar Navigation -->
  <div class="sidebar">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <i class="fas fa-shield-alt"></i>
      </div>
      <div class="logo-text">MONITOR</div>
    </a>

    <nav class="nav">
      <a href="index.html" class="nav-item active">
        <div class="nav-icon"><i class="fas fa-tachometer-alt"></i></div>
        <span class="nav-text">Overview</span>
      </a>
      <a href="incidents.html" class="nav-item">
        <div class="nav-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <span class="nav-text">Incidents</span>
      </a>
      <a href="services.html" class="nav-item">
        <div class="nav-icon"><i class="fas fa-server"></i></div>
        <span class="nav-text">Services</span>
      </a>
      <a href="analytics.html" class="nav-item">
        <div class="nav-icon"><i class="fas fa-chart-line"></i></div>
        <span class="nav-text">Analytics</span>
      </a>
      <a href="settings.html" class="nav-item">
        <div class="nav-icon"><i class="fas fa-cog"></i></div>
        <span class="nav-text">Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar">JD</div>
        <div class="user-info">
          <h4>John Doe</h4>
          <p>Admin</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="main">
    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-exclamation-triangle" style="color: #f59e0b;"></i> Incident Dashboard</h1>
      <div class="header-actions">
        <button class="btn btn-secondary" id="filterBtn">
          <i class="fas fa-filter"></i> Filter
        </button>
        <button class="btn btn-primary" id="newIncidentBtn">
          <i class="fas fa-plus"></i> New Incident
        </button>
      </div>
    </div>

    <!-- Summary Stats -->
    <div class="summary" id="summary">
      <!-- Will be populated by JavaScript -->
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading statistics...</p>
      </div>
    </div>

    <!-- Incident Dashboard -->
    <div class="dashboard-title">
      <span>Recent Incidents</span>
      <span class="time-display"><i class="far fa-clock"></i> Auto-refresh in <span id="countdown">5</span>s</span>
    </div>
    
    <div class="dashboard-grid" id="dashboard">
      <!-- Will be populated by JavaScript -->
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading incidents...</p>
      </div>
    </div>
  </div>

  <script>
    // Toast notification function
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      toast.style.position = 'fixed';
      toast.style.bottom = '20px';
      toast.style.right = '20px';
      toast.style.padding = '12px 20px';
      toast.style.background = type === 'success' ? '#10b981' : 
                              type === 'error' ? '#ef4444' : 
                              type === 'warning' ? '#f59e0b' : '#3b82f6';
      toast.style.color = 'white';
      toast.style.borderRadius = '8px';
      toast.style.zIndex = '10000';
      toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
      toast.style.animation = 'slideIn 0.3s ease';
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Add CSS for animations
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes slideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
    `;
    document.head.appendChild(style);

    // Get time ago helper function
    function getTimeAgo(date) {
      const now = new Date();
      const diffMs = now - new Date(date);
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      
      if (diffMins < 60) {
        return `${diffMins} min${diffMins !== 1 ? 's' : ''} ago`;
      } else if (diffHours < 24) {
        return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
      } else {
        return `${diffDays} day${diffDays !== 1 ? 's' : ''} ago`;
      }
    }

    // Get status icon helper function
    function getStatusIcon(status) {
      switch(status) {
        case 'open': return 'fa-exclamation-circle';
        case 'acknowledged': return 'fa-user-check';
        case 'resolved': return 'fa-check-circle';
        default: return 'fa-question-circle';
      }
    }

    // Sample data for demonstration
    const sampleIncidents = [
      {
        id: "INC-2023-00142",
        service: "API Gateway",
        severity: "high",
        status: "open",
        created_at: "2023-10-15T14:30:00Z",
        description: "Increased latency across all endpoints"
      },
      {
        id: "INC-2023-00141",
        service: "Database Cluster",
        severity: "critical",
        status: "acknowledged",
        created_at: "2023-10-15T12:15:00Z",
        description: "Primary node failure detected"
      },
      {
        id: "INC-2023-00140",
        service: "Authentication Service",
        severity: "medium",
        status: "resolved",
        created_at: "2023-10-14T22:45:00Z",
        description: "Intermittent login failures"
      },
      {
        id: "INC-2023-00139",
        service: "CDN Edge",
        severity: "low",
        status: "open",
        created_at: "2023-10-14T18:20:00Z",
        description: "Cache miss rate increased by 15%"
      },
      {
        id: "INC-2023-00138",
        service: "Payment Processing",
        severity: "high",
        status: "acknowledged",
        created_at: "2023-10-14T10:05:00Z",
        description: "Transaction timeout errors"
      },
      {
        id: "INC-2023-00137",
        service: "Notification Service",
        severity: "medium",
        status: "resolved",
        created_at: "2023-10-13T16:40:00Z",
        description: "Email delivery delays"
      }
    ];

    // DOM Elements
    const summaryEl = document.getElementById('summary');
    const dashboardEl = document.getElementById('dashboard');
    const countdownEl = document.getElementById('countdown');

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadIncidents();
      startAutoRefresh();
      
      // New incident button
      document.getElementById('newIncidentBtn').addEventListener('click', () => {
        showToast('Create incident form would open here', 'info');
      });
      
      // Filter button
      document.getElementById('filterBtn').addEventListener('click', () => {
        showToast('Filter options would open here', 'info');
        loadIncidents();
        countdown = 5; // Reset countdown on manual refresh
        countdownEl.textContent = countdown;
      });
      
      // Set active nav item
      document.querySelector('a[href="index.html"]').classList.add('active');
    });

    // Load incidents (with sample data as fallback)
    async function loadIncidents() {
      try {
        // Try to fetch from API
        const response = await fetch("http://localhost:8001/api/v1/incidents");
        const incidents = await response.json();
        updateSummary(incidents);
        renderCards(incidents);
      } catch (err) {
        // Fallback to sample data if API is unavailable
        console.warn("API unavailable, using sample data:", err);
        updateSummary(sampleIncidents);
        renderCards(sampleIncidents);
      }
    }

    // Update summary statistics
    function updateSummary(incidents) {
      const total = incidents.length;
      const open = incidents.filter(i => i.status === "open").length;
      const acknowledged = incidents.filter(i => i.status === "acknowledged").length;
      const resolved = incidents.filter(i => i.status === "resolved").length;

      // Calculate change percentages (mock data for demo)
      const openChange = open > 2 ? "+12%" : "-5%";
      const acknowledgedChange = acknowledged > 1 ? "+8%" : "-3%";
      const resolvedChange = resolved > 2 ? "+15%" : "-2%";

      summaryEl.innerHTML = `
        <div class="stat-card total">
          <div class="stat-header">
            <div class="stat-title">Total Incidents</div>
            <div class="stat-icon"><i class="fas fa-list-alt"></i></div>
          </div>
          <div class="stat-value">${total}</div>
          <div class="stat-change">Last 24h <span class="positive">+${Math.floor(total/2)}</span></div>
        </div>
        
        <div class="stat-card open">
          <div class="stat-header">
            <div class="stat-title">Open</div>
            <div class="stat-icon"><i class="fas fa-exclamation-circle"></i></div>
          </div>
          <div class="stat-value">${open}</div>
          <div class="stat-change ${openChange.startsWith('+') ? 'negative' : 'positive'}">${openChange} from yesterday</div>
        </div>
        
        <div class="stat-card acknowledged">
          <div class="stat-header">
            <div class="stat-title">Acknowledged</div>
            <div class="stat-icon"><i class="fas fa-user-check"></i></div>
          </div>
          <div class="stat-value">${acknowledged}</div>
          <div class="stat-change ${acknowledgedChange.startsWith('+') ? 'negative' : 'positive'}">${acknowledgedChange} from yesterday</div>
        </div>
        
        <div class="stat-card resolved">
          <div class="stat-header">
            <div class="stat-title">Resolved</div>
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
          </div>
          <div class="stat-value">${resolved}</div>
          <div class="stat-change ${resolvedChange.startsWith('+') ? 'positive' : 'negative'}">${resolvedChange} from yesterday</div>
        </div>
      `;
    }

    // Render incident cards
    function renderCards(incidents) {
      if (!incidents.length) {
        dashboardEl.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px;">
            <div style="font-size: 4rem; color: #94a3b8; margin-bottom: 20px;">
              <i class="far fa-check-circle"></i>
            </div>
            <h3>No Active Incidents</h3>
            <p style="color: #94a3b8; max-width: 400px; margin: 10px auto;">
              All systems are operating normally. No incidents reported in the last 24 hours.
            </p>
          </div>
        `;
        return;
      }

      dashboardEl.innerHTML = incidents.map(incident => {
        // Format date
        const createdDate = new Date(incident.created_at);
        const timeAgo = getTimeAgo(createdDate);
        
        // Get appropriate severity class
        const severityClass = `severity-${incident.severity}`;
        
        // Get appropriate status class
        const statusClass = `status-${incident.status}`;
        
        return `
          <div class="incident-card">
            <div class="card-header">
              <div class="service-name">${incident.service}</div>
              <div class="incident-id">${incident.id}</div>
            </div>
            
            <div class="incident-details">
              <div class="detail-row">
                <div class="detail-label">Severity</div>
                <div class="detail-value">
                  <span class="badge severity-badge ${severityClass}">${incident.severity}</span>
                </div>
              </div>
              
              <div class="detail-row">
                <div class="detail-label">Status</div>
                <div class="detail-value">
                  <span class="badge status-badge ${statusClass}">
                    <i class="fas ${getStatusIcon(incident.status)}"></i>
                    ${incident.status}
                  </span>
                </div>
              </div>
              
              <div class="detail-row">
                <div class="detail-label">Description</div>
                <div class="detail-value" style="max-width: 200px; text-align: right;">${incident.description}</div>
              </div>
            </div>
            
            <div class="card-footer">
              <div class="time-display">
                <i class="far fa-clock"></i>
                Created ${timeAgo}
              </div>
              <button class="action-btn" onclick="viewIncident('${incident.id}')">
                View Details
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Auto-refresh functionality
    let countdown = 5;
    let countdownInterval;

    function startAutoRefresh() {
      countdownInterval = setInterval(() => {
        countdown--;
        countdownEl.textContent = countdown;
        
        if (countdown <= 0) {
          loadIncidents();
          countdown = 5;
        }
      }, 1000);
    }

    // View incident details (placeholder)
    function viewIncident(id) {
      showToast(`Viewing details for incident: ${id}`, 'info');
    }
  </script>
</body>
</html>
