server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Add this line to handle other HTML files
        try_files $uri $uri.html $uri/ =404;
    }

    location /api/ {
        proxy_pass http://alert-ingestion:8001;
    }
    
    # Add this for CSS/JS files
    location ~ \.(css|js)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}